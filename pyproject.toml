[project]
name = "sctui"
version = "0.1.0"
description = "A terminal SoundCloud player (Textual + mpv + yt-dlp)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "dbus-fast>=5.2.0",
    "numpy>=2.4.6",
    "textual>=1.0",
    "yt-dlp>=2025.1.1",
]

[project.scripts]
sc = "sctui.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sctui"]
